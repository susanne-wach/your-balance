<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TikTok-Verbindung · Your Balance</title>
<style>
  :root { --aubergine:#5B2A4A; --gold:#CFAC5E; --cream:#FBF5EC; }
  body { margin:0; font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; background:var(--cream); color:var(--aubergine); }
  main { max-width:560px; margin:12vh auto; padding:0 20px; text-align:center; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight:500; font-size:2rem; margin:0 0 .5rem; }
  p { line-height:1.6; }
  code { display:block; word-break:break-all; background:#fff; border:1px solid var(--gold); border-radius:8px; padding:14px; margin:18px 0; font-size:.95rem; }
  button { background:linear-gradient(135deg,#E2C577,#CFAC5E); color:var(--aubergine); border:0; border-radius:999px; padding:12px 28px; font-weight:600; cursor:pointer; }
  .ok { color:#2e7d32; font-size:.9rem; min-height:1.2rem; }
</style>
</head>
<body>
<main>
  <h1>TikTok-Verbindung</h1>
  <p id="text">Die Verbindung wurde bestätigt. Dieser Code gehört zur Einrichtung und wird nur einmal gebraucht:</p>
  <code id="code">…</code>
  <button id="copy" type="button">Code kopieren</button>
  <div class="ok" id="ok"></div>
</main>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get("auth_code") || p.get("code") || "";
  var el = document.getElementById("code");
  if (code) { el.textContent = code; }
  else { el.textContent = "Kein Code in der Adresse gefunden."; document.getElementById("text").textContent = "Diese Seite wird nur bei der Einrichtung der TikTok-Verbindung gebraucht."; document.getElementById("copy").style.display = "none"; }
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(code).then(function () { document.getElementById("ok").textContent = "Kopiert. Jetzt Claude Bescheid sagen: „TikTok-Code kopiert“."; });
  };
</script>
</body>
</html>
